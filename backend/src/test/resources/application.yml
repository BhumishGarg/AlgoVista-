spring:
  application:
    name: algovista-api-test
  datasource:
    url: jdbc:h2:mem:algovista;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
algovista:
  frontend-origins: http://localhost:5173,http://127.0.0.1:5173
  cookie-secure: false
  cookie-same-site: lax
