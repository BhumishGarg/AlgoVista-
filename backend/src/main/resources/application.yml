server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        path: /
spring:
  application:
    name: algovista-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/algovista?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:algovista}
    password: ${DB_PASSWORD:replace-with-a-local-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
algovista:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  cookie-secure: ${COOKIE_SECURE:false}
  cookie-same-site: ${SESSION_COOKIE_SAME_SITE:lax}
